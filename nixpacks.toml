[phases.setup]
nixPkgs = ['nodejs_20']
aptPkgs = ['curl']

[phases.install]
cmds = [
  'corepack enable',
  'corepack prepare yarn@1.22.22 --activate',
  'yarn install --frozen-lockfile'
]

[phases.build]
cmds = ['yarn build']

[start]
cmd = 'yarn start'

[variables]
NODE_ENV = 'production'
NEXT_TELEMETRY_DISABLED = '1'
NODE_OPTIONS = '--max-old-space-size=4096'
